<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1325" />
      <stop offset="50%" stop-color="#152244" />
      <stop offset="100%" stop-color="#080E1C" />
    </linearGradient>

    <!-- Warm Rim Light -->
    <radialGradient id="halo" cx="50%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.3" />
      <stop offset="60%" stop-color="#D97706" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#0B1325" stop-opacity="0" />
    </radialGradient>

    <!-- Gold Accent Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>

    <!-- Skin Tone Gradient -->
    <linearGradient id="skin" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E5B28B" />
      <stop offset="100%" stop-color="#C68A5D" />
    </linearGradient>

    <!-- Hair Tone -->
    <linearGradient id="hair" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D3748" />
      <stop offset="70%" stop-color="#1A202C" />
      <stop offset="100%" stop-color="#4A5568" />
    </linearGradient>

    <!-- Suit Black/Navy Gradient -->
    <linearGradient id="suit" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1F2937" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="400" height="400" rx="32" fill="url(#bgGrad)" />
  <circle cx="200" cy="160" r="160" fill="url(#halo)" />

  <!-- Law Library Bookshelf Background Elements (Subtle) -->
  <g opacity="0.15">
    <rect x="25" y="40" width="18" height="110" rx="2" fill="#E2E8F0" />
    <rect x="47" y="55" width="22" height="95" rx="2" fill="#F59E0B" />
    <rect x="73" y="45" width="16" height="105" rx="2" fill="#94A3B8" />
    <rect x="93" y="60" width="20" height="90" rx="2" fill="#E2E8F0" />
    <rect x="285" y="45" width="22" height="105" rx="2" fill="#F59E0B" />
    <rect x="311" y="50" width="18" height="100" rx="2" fill="#E2E8F0" />
    <rect x="333" y="38" width="24" height="112" rx="2" fill="#94A3B8" />
    <rect x="361" y="55" width="16" height="95" rx="2" fill="#CBD5E1" />
    <line x1="20" y1="150" x2="380" y2="150" stroke="#F59E0B" stroke-width="2" />
  </g>

  <!-- Ambient Scales of Justice watermark -->
  <g opacity="0.12" stroke="#F59E0B" stroke-width="3" fill="none" transform="translate(140, 20) scale(0.6)">
    <line x1="100" y1="20" x2="100" y2="160" stroke-width="6" />
    <line x1="40" y1="50" x2="160" y2="50" stroke-width="5" />
    <path d="M40 50 L20 100 L60 100 Z" fill="#F59E0B" opacity="0.5" />
    <path d="M160 50 L140 100 L180 100 Z" fill="#F59E0B" opacity="0.5" />
    <rect x="70" y="160" width="60" height="15" rx="3" fill="#F59E0B" />
  </g>

  <!-- Advocate Body & Silhouette -->
  <!-- Shoulders & Black Advocate Robe / Coat -->
  <path d="M60 400 C65 310 115 270 150 250 L250 250 C285 270 335 310 340 400 Z" fill="url(#suit)" stroke="#374151" stroke-width="1.5" />

  <!-- Lapels of Advocate Coat -->
  <path d="M140 252 L175 350 L195 400 L160 400 L125 310 Z" fill="#0B1325" />
  <path d="M260 252 L225 350 L205 400 L240 400 L275 310 Z" fill="#0B1325" />
  <path d="M140 252 L175 350 L200 350 L225 350 L260 252" stroke="#4B5563" stroke-width="2" fill="none" />

  <!-- Crisp White Shirt (Wing Collar) -->
  <polygon points="175,250 225,250 215,350 185,350" fill="#FFFFFF" />
  <polygon points="175,250 195,270 170,275" fill="#E5E7EB" />
  <polygon points="225,250 205,270 230,275" fill="#E5E7EB" />

  <!-- White Advocate Bands (Advocate Tabs) -->
  <g>
    <!-- Left Band -->
    <rect x="188" y="270" width="10" height="52" rx="1.5" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1" />
    <!-- Right Band -->
    <rect x="202" y="270" width="10" height="52" rx="1.5" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1" />
    <!-- Band knot -->
    <rect x="187" y="266" width="26" height="7" rx="2" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="0.75" />
  </g>

  <!-- Neck -->
  <path d="M180 210 L180 260 C180 268 220 268 220 260 L220 210 Z" fill="url(#skin)" />
  <path d="M180 240 C195 255 205 255 220 240" stroke="#B47348" stroke-width="2" fill="none" opacity="0.4" />

  <!-- Head & Face -->
  <path d="M152 145 C152 85 248 85 248 145 C248 198 228 232 200 232 C172 232 152 198 152 145 Z" fill="url(#skin)" />

  <!-- Ears -->
  <path d="M148 145 C144 140 144 165 152 168 Z" fill="#C68A5D" />
  <path d="M252 145 C256 140 256 165 248 168 Z" fill="#C68A5D" />

  <!-- Hair (Sleek, Professional Advocate Cut with slight silvering) -->
  <path d="M148 135 C148 78 185 62 200 62 C215 62 252 78 252 135 C245 105 235 90 200 90 C165 90 155 105 148 135 Z" fill="url(#hair)" />
  <path d="M148 130 C154 110 170 95 195 93 C220 95 240 108 252 130 C248 118 240 105 225 100 C210 95 185 96 170 104 C158 112 152 122 148 130 Z" fill="#4B5563" opacity="0.6" />

  <!-- Eyebrows -->
  <path d="M168 128 C175 125 185 126 190 130" stroke="#1F2937" stroke-width="3" stroke-linecap="round" fill="none" />
  <path d="M210 130 C215 126 225 125 232 128" stroke="#1F2937" stroke-width="3" stroke-linecap="round" fill="none" />

  <!-- Eyes & Eyeglasses (Dignified Frame) -->
  <g>
    <!-- Eyeglass Frames -->
    <rect x="162" y="132" width="32" height="22" rx="6" fill="#FFFFFF" fill-opacity="0.1" stroke="#F59E0B" stroke-width="2" />
    <rect x="206" y="132" width="32" height="22" rx="6" fill="#FFFFFF" fill-opacity="0.1" stroke="#F59E0B" stroke-width="2" />
    <line x1="194" y1="142" x2="206" y2="142" stroke="#F59E0B" stroke-width="2.5" />
    <line x1="152" y1="140" x2="162" y2="140" stroke="#F59E0B" stroke-width="1.5" />
    <line x1="238" y1="140" x2="248" y2="140" stroke="#F59E0B" stroke-width="1.5" />

    <!-- Eyes (Warm, Keen) -->
    <ellipse cx="178" cy="143" rx="4.5" ry="5" fill="#1E293B" />
    <circle cx="176.5" cy="141.5" r="1.5" fill="#FFFFFF" />
    <ellipse cx="222" cy="143" rx="4.5" ry="5" fill="#1E293B" />
    <circle cx="220.5" cy="141.5" r="1.5" fill="#FFFFFF" />
  </g>

  <!-- Nose -->
  <path d="M200 138 L197 165 C197 168 203 168 203 165 Z" fill="#BA784E" />

  <!-- Moustache / Gentle Smile -->
  <path d="M188 178 C195 174 205 174 212 178" stroke="#374151" stroke-width="2.5" stroke-linecap="round" fill="none" />
  <path d="M186 186 C193 194 207 194 214 186" stroke="#B45309" stroke-width="2.5" stroke-linecap="round" fill="none" />

  <!-- Golden Advocate Chamber Lapel Badge -->
  <g transform="translate(142, 290)">
    <circle cx="12" cy="12" r="10" fill="url(#goldGrad)" stroke="#78350F" stroke-width="1" />
    <!-- Scales inside badge -->
    <path d="M12 6 L12 18 M8 9 L16 9 M7 12 L9 12 M15 12 L17 12" stroke="#451A03" stroke-width="1.2" stroke-linecap="round" />
  </g>

  <!-- Top "LIVE AI VAKIL" Pill Badge -->
  <g transform="translate(20, 20)">
    <rect width="130" height="28" rx="14" fill="#0B1325" fill-opacity="0.9" stroke="#10B981" stroke-width="1.5" />
    <circle cx="16" cy="14" r="5" fill="#10B981" />
    <text x="30" y="19" font-family="sans-serif" font-size="11" font-weight="bold" fill="#FFFFFF" letter-spacing="0.5">AI ADVOCATE</text>
  </g>

  <!-- Golden Frame Border -->
  <rect x="4" y="4" width="392" height="392" rx="28" fill="none" stroke="url(#goldGrad)" stroke-width="3" opacity="0.6" />
</svg>
